name: Recovery baseline checks

on:
  push:
    branches:
      - main
      - "recovery/**"
      - "feature/**"
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Regression tests for SPA and API routing
        run: node --test tests/routing.test.mjs
      - name: Order email tests
        run: node --import tsx --test tests/order-email.test.ts
      - name: Production build
        run: npm run build
